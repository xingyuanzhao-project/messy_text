# Evaluation-only pipeline: score existing summaries.
# Mirrors scripts/run_evaluation.py.
#
# Reads a CSV that already has `summary_all_context` populated and runs
# enabled evaluation benchmarks against the source text.
#
# SummaC and DefaultMetrics require heavy local dependencies that may
# not be installed. Use scripts/run_evaluation.py directly for those.
# This YAML supports the LLM-based G-Eval benchmarks out of the box.
#
# Run with:
#   python scripts/run_custom_flow.py
# after setting `flow_config` to this YAML path.

flow:
  schema_version: 1
  name: evaluation_only
  description: "Run evaluation benchmarks on existing summaries"

  resources:
    - id: default
      type: llm_provider
      provider: openrouter
      model: meta-llama/llama-3.1-70b-instruct
      api_base: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      temperature: 0.0
      max_tokens_summary: 1024
      max_tokens_classification: 256

  data:
    input_csv: results_custom/summary.csv
    column_roles:
      text: text
      entity_id: victim
      doc_id: index
      sort_by: index

  taxonomy: config/taxonomy.json
  prompts: config/prompts.json

  steps:
    - type: evaluation
      unit: row
      benchmarks:
        geval_summarization: true
        geval_hallucination: true

  async:
    enabled: true
    max_concurrent_rows: 10
    max_concurrent_llm_calls: 10
    max_retries: 5

  output:
    summary_csv: results_custom/evaluation_scores.csv
    extend: false

  logging:
    file: processing.log
    log_progress: true
  display:
    use_progress_bar: true
