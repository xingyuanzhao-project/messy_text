model:
  name: "mistralai/Ministral-3-8B-Instruct-2512"
  api_base: "http://localhost:8000/v1"
  api_key: "dummy"

paths:
  input: "df_text_by_victim.csv"
  output:
    file: "df_text_clas_multi_by_victim.csv"
    extend: True
  eval_output: "df_text_multi_eval_by_victim.csv"
  taxonomy: "config/taxonomy.json"

async:
  enabled: True
  max_retries: 5
  max_concurrent_rows: 30

processing:
  temperature: 0.0
  max_tokens_summary: 1024
  max_tokens_classification: 256
  start_index: 0
  early_break: null
  inner_loop_break: null

evaluation:
  rows_eval_break: null
  benchmarks:
    enable_geval_summarization: False
    enable_geval_hallucination: False
    enable_summac_zs: False
    enable_summac_conv: False
    enable_default_metrics: True

    summac_settings:
      device: "cuda"
      granularity: "sentence"
      model_name: "vitc"


display:
  use_progress_bar: True

logging:
  log_resources: false
  log_prompts: false
  log_response: false
  log_progress: True
  file: "processing.log"
